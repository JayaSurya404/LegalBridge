[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legalbridge-india-api"
version = "0.2.0"
description = "Frontend-adjacent FastAPI foundation for the LegalBridge India hackathon prototype."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.140.13",
  "pydantic-settings==2.14.2",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
