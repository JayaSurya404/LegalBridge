services:
  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      LEGALBRIDGE_ENVIRONMENT: production
      LEGALBRIDGE_HOST: 0.0.0.0
      LEGALBRIDGE_DOCS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - legalbridge_uploads:/app/data/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_DATA_MODE: http
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  legalbridge_uploads:
